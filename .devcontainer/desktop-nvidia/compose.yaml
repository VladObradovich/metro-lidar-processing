services:
  metro-lidar-processing:
    build:
      context: ../../docker
      dockerfile: Dockerfile
      target: desktop
    init: true
    shm_size: 1gb
    environment:
      ROS_DOMAIN_ID: "42"
      ROS_LOCALHOST_ONLY: "1"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      DISPLAY: ${DISPLAY}
      QT_QPA_PLATFORM: xcb
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_SOFTWARE: "0"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      __GLX_VENDOR_LIBRARY_NAME: nvidia
      __NV_PRIME_RENDER_OFFLOAD: "1"
    volumes:
      - ../..:/home/dev/metro_ws/src/metro-lidar-processing
      - ../../../archive/for_hackathon:/data:ro
      - ../../../videos:/results
      - ../.runtime/x11:/tmp/.X11-unix
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

