# Full 360-degree LiDAR with unresolved vehicle-forward direction.
# Keep the cloud in its native frame and fail closed until orientation is established.
source_frame: lidar_livox
target_frame: lidar_livox
calibration_verified: false
allow_unverified_calibration: false
translation_m: null
rotation_rpy_rad: null
calibration_source: 'Unresolved: full 360-degree scan does not determine vehicle forward axis'
blind_radius_m: 0.5
geometry_roi:
  min: [-150.0, -150.0, -20.0]
  max: [150.0, 150.0, 20.0]
detection_roi:
  min: [-150.0, -150.0, -20.0]
  max: [150.0, 150.0, 20.0]
