schema_version: 1
bag_id: cloud_with_fake_obj
reviewed: true
time_basis: bag_stamp_ns
review_method: inserted_returns_trailing_block
review_limits: 'Generated by scripts/annotate_inserted_objects.py from the clouds and the organizer scene
  table in evaluation/scene_context.yaml (bags.cloud_with_fake_obj). Inserted returns: the trailing block
  of intensity-1.0 returns that the insertion appends after the recorded organised cloud. 83% of them
  lie off the lidar channels; the recorded part has at most 0 off-channel returns per cloud (channels
  found in it: 128). Returns closer than 0.3 m are not used. Each scene object is followed back from its
  closest approach in the organizer window. distance_m is the nearest x of its returns; the ROI is their
  exact box (the metrics add their own matching margin); uncertainty_m is not estimated. Visibility rule
  of the synthetic benchmark (inject_obstacle.py): an inside object is positive from the first frame with
  at least 10 returns within 200 m to its last frame at least 1 m ahead; before that it counts as absent.
  Uncertain (not scored): an inside object closer than 1 m or out of view until the train reaches it at
  its last approach speed. Negative: everything else, including objects the organizers class outside or
  above the envelope. Inside, outside and above are the organizer classes; the envelope itself is not
  given, and the current detector corridor (forward_sector_assumed.yaml: +-2 m, 3.5 m above the track)
  also contains objects 5 and 7 and the lower part of 8, so an alarm on them is false against the classes
  but expected from that corridor. The positive frames do not depend on a detector: frames beyond its
  range stay positive; metrics.py reports object recall by distance and, apart from the totals, within
  the range of the run profile. It also counts alarms on the outside and above objects on every frame,
  including frames that another object makes positive. Axes are the assumed forward-sector frame. The
  legacy person_roi_assumed_m key is the generic object ROI read by the metrics; returns is the number
  of inserted returns behind the reference.'
