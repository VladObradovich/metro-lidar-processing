reviewed: true
time_basis: bag_stamp_ns
review_method: owner_ground_truth_depth_video_and_raw_pointcloud_review_all_positive_frames
review_limits: Ground truth from the data owner - the only obstacle in this bag is one person, who appears in the
  cloud at about +13 s beside the cab and runs forward along the track to the end of the bag. The depth video
  shows the person entering from the right edge at about +13.5 s and moving to the route centre by +16..17 s.
  Negative until +13.086 s (first frame with the person); uncertain while the person stands beside the cab, almost
  entirely outside |y| <= 2 m (+13.086 to +14.607 s); positive from the first frame with a substantial part of the
  person inside the corridor ahead of the lidar. ROIs from +14.61 to +16.90 s are the raw foreground blob against
  the empty control frame +10 s, padded by 0.1 m; ROIs from +17.00 s follow the manually reviewed trajectory
  with a fixed 0.7 m longitudinal width and are not a tight fit to every point. All ROIs are independent of
  detector candidates. Vehicle axes and track clearance are not independently calibrated. Only two late frames
  have measured lidar-derived longitudinal ranges; these are not surveyed vehicle distances.
