review_limits: Interval boundaries are conservative visual estimates. All 35 positive frames were reviewed as a
  raw-cloud trajectory in the assumed target frame. ROIs follow the manually reviewed trajectory near lateral
  coordinate 2 m with a fixed 0.7 m longitudinal width; they are not a tight per-frame fit to every person point.
  At bag +17.59 and +17.68 s they contain about 58% and 77% of the differing person points, respectively.
  The ROIs are independent of detector candidates. Early ROIs contain 8-50 background points in the empty control
  frame, versus more than 1800 points with the person. Vehicle axes and track clearance are not independently
  calibrated. Only two late frames have measured lidar-derived longitudinal ranges; these are not surveyed vehicle distances.
