schema_version: 1
bag_id: doubleT_obstacle
reviewed: true
time_basis: bag_stamp_ns
review_method: owner_ground_truth_depth_video_and_raw_pointcloud_review_all_positive_frames
review_limits: Ground truth from the data owner names one person, who appears in the cloud at about +13 s beside
  the cab and runs forward along the track to the end of the bag; the depth video shows that person
  entering from the right edge at about +13.5 s and moving to the route centre by +16..17 s. A raw
  point cloud review on 2026-09-25 found a second person on the track 54.5-57 m ahead in every
  frame (about 1.6 m tall, 0.5 m wide, standing on the track bed), walking across the track to y =
  -1.75 m and back to +0.95 m until +12 s, then standing still at y = +0.8 m to the end; the user
  confirmed it in RViz. It was missed earlier because the empty control frame +10 s already held
  that person standing still, and on the depth video it is only 2-3 pixels wide. Hence the whole
  bag is positive. ROIs of the near person from +14.61 to +16.90 s are the raw foreground blob
  against the control frame +10 s, padded by 0.1 m; from +17.00 s they follow the manually reviewed
  trajectory with a fixed 0.7 m longitudinal width and are not a tight fit to every point. ROIs of
  the far person are the raw foreground blob within 1 m of its track against a person-free
  background built from every frame, padded by 0.1 m. All ROIs are independent of detector
  candidates. Vehicle axes and track clearance are not independently calibrated. Only two late
  frames have measured lidar-derived longitudinal ranges; these are not surveyed vehicle distances.
reviewed_intervals:
