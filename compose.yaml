services:
  desktop:
    image: metro-lidar:desktop
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
      target: runtime-desktop
    init: true
    shm_size: 1gb
    user: "${METRO_UID:-1000}:${METRO_GID:-1000}"
    environment:
      DISPLAY: "${DISPLAY:-}"
    volumes:
      # scripts/desktop.sh points this at its X11 proxy directory; without the script the host
      # socket directory is used (allow the container with `xhost +local:`).
      - type: bind
        source: ${METRO_X11_DIR:-/tmp/.X11-unix}
        target: /tmp/.X11-unix
      - type: bind
        source: ${METRO_BAGS_DIR:-./rosbags}
        target: /data
        read_only: true
      - type: bind
        source: ./results
        target: /results
    command: ["sleep", "infinity"]
    stop_grace_period: 20s
