# Added by scripts/desktop.sh when the NVIDIA container toolkit is present (--no-nvidia skips
# it): RViz renders on the NVIDIA GPU. The detector itself runs on the CPU.
services:
  desktop:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      __GLX_VENDOR_LIBRARY_NAME: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
